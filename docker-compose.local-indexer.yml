# ---------------------------------------------------------------------------
# Lirify LOCAL indexer stack (laptop, RTX 2050 4 GB + Arch/Docker).
#
#   docker compose -f docker-compose.yml -f docker-compose.local-indexer.yml \
#     up -d local-indexer local-ui
#
# The local indexer is standalone: it scrapes, runs core.py (sentence-transformers
# Qwen3-Embedding-0.6B), and writes only songs (Atlas) + LLM embeddings (Qdrant).
# It never calls the cloud API, and the cloud API never calls it.
# ---------------------------------------------------------------------------
services:
  local-indexer:
    build:
      context: .
      dockerfile: services/local-indexer/Dockerfile
    container_name: lirify-local-indexer
    env_file:
      - .env
    environment:
      GRPC_PORT: "50051"
      EMBEDDING_MODEL: Qwen/Qwen3-Embedding-0.6B
      EMBEDDING_DIM: "1024"
      QDRANT_COLLECTION: lirify_lyrics_qwen3
      PUBLISH_ON_INDEX: "1"
      LOAD_ON_START: "1"
    volumes:
      - hf_cache:/root/.cache/huggingface
    ports:
      - "50052:50051"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  local-ui:
    build: ./services/go-ui
    container_name: lirify-local-ui
    environment:
      PORT: "8080"
      DASHBOARD_MODE: local
      GRPC_TARGET: local-indexer:50051
      GRPC_TLS: "false"
      PUBLIC_PLAYER_URL: http://localhost:4321
    ports:
      - "8090:8080"
    depends_on:
      - local-indexer
    restart: unless-stopped

volumes:
  hf_cache:
