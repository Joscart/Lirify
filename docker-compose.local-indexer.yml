# ---------------------------------------------------------------------------
# Lirify LOCAL indexer stack (laptop, RTX 2050 4 GB + Arch/Docker).
#
#   docker compose -f docker-compose.yml -f docker-compose.local-indexer.yml \
#     up -d local-indexer local-ui
#
# The local indexer is standalone: it scrapes, runs core.py (sentence-transformers
# Qwen3-Embedding-0.6B), and writes only songs (Atlas) + LLM embeddings (Qdrant).
# It never calls the cloud API, and the cloud API never calls it.
# ---------------------------------------------------------------------------
services:
  api:
    # Web search sends the query to the indexer's Qwen3-Embedding-0.6B endpoint,
    # so queries live in the same vector space as the indexed lyrics.
    # For the standalone dev container (scripts/local/run_indexer_dev.sh) set
    # QUERY_EMBED_URL=http://host.docker.internal:8082 in .env instead.
    environment:
      QUERY_EMBED_URL: ${QUERY_EMBED_URL:-http://local-indexer:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  local-indexer:
    build:
      context: .
      dockerfile: services/local-indexer/Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    container_name: lirify-local-indexer
    env_file:
      - .env
    environment:
      GRPC_PORT: "50051"
      EMBEDDING_MODEL: Qwen/Qwen3-Embedding-0.6B
      EMBEDDING_DIM: "1024"
      QDRANT_COLLECTION: lirify_lyrics_qwen3
      PUBLISH_ON_INDEX: "1"
      LOAD_ON_START: "1"
      ADMIN_PORT: "8080"
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-auto}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-8}
      EMBEDDING_DTYPE: ${EMBEDDING_DTYPE:-float16}
      EMBEDDING_MAX_CHARS: ${EMBEDDING_MAX_CHARS:-6000}
    volumes:
      - hf_cache:/root/.cache/huggingface
    ports:
      - "50052:50051"
      # Database CRUD/reset UI: loopback only, never exposed publicly.
      - "127.0.0.1:8082:8080"
    # CPU by default: this host has no NVIDIA container runtime yet. After
    # configuring nvidia-container-toolkit add the GPU reservation back:
    #   deploy:
    #     resources:
    #       reservations:
    #         devices:
    #           - driver: nvidia
    #             count: all
    #             capabilities: [gpu]
    # and rebuild with --build-arg TORCH_INDEX_URL=https://download.pytorch.org/whl/cu124
    restart: unless-stopped

  web:
    environment:
      SEMANTIC_SEARCH: "true"

  local-ui:
    build: ./services/go-ui
    container_name: lirify-local-ui
    environment:
      PORT: "8080"
      DASHBOARD_MODE: local
      GRPC_TARGET: local-indexer:50051
      GRPC_TLS: "false"
      ADMIN_API_URL: http://local-indexer:8080
      PUBLIC_PLAYER_URL: http://localhost:4321
    ports:
      - "8090:8080"
    depends_on:
      - local-indexer
    restart: unless-stopped

volumes:
  hf_cache:
