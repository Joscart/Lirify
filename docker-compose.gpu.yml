# NVIDIA GPU overlay for the local indexer.
#
# Prerequisites (once, privileged — run them yourself):
#   sudo pacman -S --needed nvidia-container-toolkit
#   sudo nvidia-ctk runtime configure --runtime=docker
#   sudo systemctl restart docker
#   docker run --rm --gpus all nvidia/cuda:12.4.0-base-ubuntu22.04 nvidia-smi
#
# Then (CUDA 13.2 build, matching driver 620):
#   docker compose -f docker-compose.yml -f docker-compose.local-indexer.yml \
#     -f docker-compose.gpu.yml up -d --build local-indexer
services:
  local-indexer:
    build:
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu132
    environment:
      EMBEDDING_DEVICE: cuda
      EMBEDDING_DTYPE: float16
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-8}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
