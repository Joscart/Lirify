name: Quality checks

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  api:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: python -m pip install -r services/api/requirements.txt
      - name: Run unit tests
        env:
          PYTHONPATH: services/api/app
        run: python -m unittest discover -s services/api/tests -v

  browser:
    name: Astro build and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: python -m pip install -r services/api/requirements.txt playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
        working-directory: services/web
      - run: npm run build
        working-directory: services/web
      - name: Test search and themes in Chromium
        env:
          PYTHONPATH: services/api/app
        run: python services/web/tests/browser_search.py
