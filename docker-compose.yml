# Local development / single-host stack.
#
# The services are stateless: MongoDB and Qdrant run as containers here only so
# `docker compose up` needs no cloud account. In production they are MongoDB Atlas
# and Qdrant Cloud, injected through Secret Manager (see infra/).
services:
  mongo:
    image: mongo:7
    container_name: lirify-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: lirify-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build: ./services/api
    container_name: lirify-api
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB: ${MONGODB_DB:-lirify}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      BOT_INGEST_API_KEY: ${BOT_INGEST_API_KEY:-dev-bot-key}
      MAX_INDEXED_SONGS: ${MAX_INDEXED_SONGS:-1500}
    ports:
      - "8000:8080"   # REST + gRPC h2c behind the in-container mux
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  go-ui:
    build: ./services/go-ui
    container_name: lirify-go-ui
    environment:
      PORT: "8080"
      GRPC_TARGET: api:50051
      GRPC_TLS: "false"
      PYTHON_BACKEND_URL: http://api:8080
      PUBLIC_PLAYER_URL: https://${LIRIFY_DOMAIN:-lirify.joscart.win}
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    container_name: lirify-web
    environment:
      HOST: 0.0.0.0
      PORT: "4321"
      GRPC_TARGET: api:50051
      GRPC_INSECURE: "true"
      PYTHON_BACKEND_URL: http://api:8080
      PROTO_PATH: /app/proto/lirify.proto
    ports:
      - "4321:4321"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Optional public edge: https://lirify.joscart.win and the index domain.
  # Start with: docker compose --profile public up -d --build
  proxy:
    image: caddy:2-alpine
    container_name: lirify-proxy
    profiles: ["public"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      LIRIFY_DOMAIN: ${LIRIFY_DOMAIN:-lirify.joscart.win}
      LIRIFY_INDEX_DOMAIN: ${LIRIFY_INDEX_DOMAIN:-index.liirify.joscart.win}
      LIRIFY_EMAIL: ${LIRIFY_EMAIL:-admin@lirify.joscart.win}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - go-ui
      - web
    restart: unless-stopped

volumes:
  mongo_data:
  qdrant_data:
  caddy_data:
  caddy_config:
