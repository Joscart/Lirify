# Lirify — application stack.
#
# The three services are stateless and read their configuration from `.env`,
# including MONGODB_URI and QDRANT_URL:
#
#   * cloud databases (Atlas + Qdrant Cloud) — the default for this checkout:
#       docker compose up -d --build
#
#   * containerised databases (no cloud account needed):
#       docker compose -f docker-compose.yml -f docker-compose.local-db.yml up -d --build
#
# Local tuning in .env: no rate limits, unlimited index capacity.
services:
  api:
    build: ./services/api
    container_name: lirify-api
    # Single source of truth: MONGODB_URI / QDRANT_URL / limits, all from .env.
    env_file:
      - .env
    ports:
      - "8000:8080"    # REST + gRPC h2c behind the in-container mux
      - "50051:50051"  # direct gRPC, handy for grpcurl
    # No database dependency: with cloud databases this stack starts standalone.
    # docker-compose.local-db.yml adds the ordering for containerised databases.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  go-ui:
    build: ./services/go-ui
    container_name: lirify-go-ui
    environment:
      PORT: "8080"
      GRPC_TARGET: api:50051
      GRPC_TLS: "false"
      PYTHON_BACKEND_URL: http://api:8080
      PUBLIC_PLAYER_URL: https://${LIRIFY_DOMAIN}
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    container_name: lirify-web
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      GRPC_TARGET: api:50051
      GRPC_INSECURE: "true"
      PYTHON_BACKEND_URL: http://api:8080
      PROTO_PATH: /app/proto/lirify.proto
    ports:
      - "4321:8080"   # host 4321 -> container 8080 (Cloud Run's port)
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Optional public edge: https://lirify.joscart.win and the index domain.
  # Start with: docker compose --profile public up -d --build
  proxy:
    image: caddy:2-alpine
    container_name: lirify-proxy
    profiles: ["public"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      LIRIFY_DOMAIN: ${LIRIFY_DOMAIN}
      LIRIFY_INDEX_DOMAIN: ${LIRIFY_INDEX_DOMAIN}
      LIRIFY_EMAIL: ${LIRIFY_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - go-ui
      - web
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
